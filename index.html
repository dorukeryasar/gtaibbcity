<script>
(function(){
'use strict';
/* ===== util ===== */
const T=THREE,$=id=>document.getElementById(id);
const R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[(R()*a.length)|0];

/* ===== renderer ===== */
const canvas=$('gl');

renderer.setPixelRatio(Math.max(0.75,Math.min(window.devicePixelRatio||1,2)*0.5));
const scene=new T.Scene();

const camera=new T.PerspectiveCamera(62,1,0.4,1500);
function onResize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?78:62;camera.updateProjectionMatrix()}
addEventListener('resize',onResize);onResize();
scene.add(new T.AmbientLight(0xd0b4ea,0.8));
const sunL=new T.DirectionalLight(0xffd6a8,0.9);sunL.position.set(-1,0.7,-0.6);scene.add(sunL);
const world=new T.Group();scene.add(world);
/* sky */
const skyG=new T.Group();scene.add(skyG);
(function(){const g=new T.SphereGeometry(1000,20,14),P=g.attributes.position,cols=[];
 const top=new T.Color(0x3b2f8f),mid=new T.Color(0xff5f9e),hor=new T.Color(0xffb184),c=new T.Color();
 for(let i=0;i<P.count;i++){const y=P.getY(i)/1000;if(y<=0)c.copy(hor);else if(y<0.28)c.copy(hor).lerp(mid,y/0.28);else c.copy(mid).lerp(top,Math.min(1,(y-0.28)/0.55));cols.push(c.r,c.g,c.b)}
 g.setAttribute('color',new T.Float32BufferAttribute(cols,3));
 skyG.add(new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false})));
 const sun=new T.Mesh(new T.CircleGeometry(95,28),new T.MeshBasicMaterial({color:0xffe08a,fog:false,depthWrite:false}));
 const d=new T.Vector3(-1,0.13,-0.6).normalize().multiplyScalar(900);sun.position.copy(d);sun.lookAt(0,0,0);skyG.add(sun);
 const halo=new T.Mesh(new T.CircleGeometry(190,28),new T.MeshBasicMaterial({color:0xff8fb0,fog:false,transparent:true,opacity:0.35,depthWrite:false}));
 halo.position.copy(d).multiplyScalar(1.01);halo.lookAt(0,0,0);skyG.add(halo)})();
/* ===== textures ===== */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);if(rep)t.wrapS=t.wrapT=T.RepeatWrapping;else t.minFilter=T.LinearFilter;t.magFilter=T.NearestFilter;return t}
const winTex=ctex(128,128,(x,w,h)=>{x.fillStyle='#f0ebe2';x.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){const px=i*32+6,py=j*32+7;x.fillStyle='#7d7a86';x.fillRect(px-2,py-2,24,24);const r=R();x.fillStyle=r<0.28?'#ffd98a':r<0.34?'#9fe8ff':'#2f3d5c';x.fillRect(px,py,20,20);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(px,py,20,5)}x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,w,3)},true);
const roadTex=ctex(64,128,(x,w,h)=>{x.fillStyle='#3d3d47';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';x.fillRect(R()*w,R()*h,2,2)}x.fillStyle='#e9e9e9';x.fillRect(3,0,2,h);x.fillRect(59,0,2,h);x.fillStyle='#f2c230';x.fillRect(30,0,4,70)},true);
const waterTex=ctex(64,64,(x,w,h)=>{x.fillStyle='#1c7f97';x.fillRect(0,0,w,h);for(let i=0;i<40;i++){x.fillStyle=R()<.5?'rgba(255,170,200,.35)':'rgba(120,230,235,.35)';x.fillRect(R()*w,R()*h,rr(4,14),2)}},true);
waterTex.repeat.set(160,160);
function textTex(txt,fg,bg,w=256,h=80,glow){return ctex(w,h,(x)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.font='900 '+(h*0.62|0)+'px Impact,Arial Black,sans-serif';x.textAlign='center';x.textBaseline='middle';if(glow){x.shadowColor=fg;x.shadowBlur=14}x.fillStyle=fg;x.fillText(txt,w/2,h/2+2)})}
/* ===== merged geometry baking ===== */
function MG(){return{p:[],n:[],c:[],u:[]}}
const _q=new T.Quaternion(),_e=new T.Euler(),_v=new T.Vector3(),_n=new T.Vector3(),_m=new T.Matrix4(),_c=new T.Color(),_one=new T.Vector3(1,1,1);
function put(mg,geo,x,y,z,col,ry=0,uvf=null,rx=0,rz=0){
 const g=geo.index?geo.toNonIndexed():geo,P=g.attributes.position,N=g.attributes.normal,U=g.attributes.uv;
 _q.setFromEuler(_e.set(rx,ry,rz,'YXZ'));_m.compose(_v.set(x,y,z),_q,_one);_c.set(col);
 for(let i=0;i<P.count;i++){
  _v.fromBufferAttribute(P,i).applyMatrix4(_m);mg.p.push(_v.x,_v.y,_v.z);
  _n.fromBufferAttribute(N,i).applyQuaternion(_q).normalize();mg.n.push(_n.x,_n.y,_n.z);
  const f=clamp(0.78+0.22*_n.y+0.10*_n.x-0.06*_n.z,0.5,1.05);mg.c.push(_c.r*f,_c.g*f,_c.b*f);
  let u=U.getX(i),v=U.getY(i);if(uvf){const r=uvf(Math.floor(i/6),u,v);u=r[0];v=r[1]}mg.u.push(u,v)}}
function meshFrom(mg,mat,mapped){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(mg.p,3));g.setAttribute('normal',new T.Float32BufferAttribute(mg.n,3));g.setAttribute('color',new T.Float32BufferAttribute(mg.c,3));if(mapped)g.setAttribute('uv',new T.Float32BufferAttribute(mg.u,2));const m=new T.Mesh(g,mat);m.frustumCulled=false;return m}
const BX=(w,h,d)=>new T.BoxGeometry(w,h,d);
const CY=(rt,rb,h,s=8)=>new T.CylinderGeometry(rt,rb,h,s);
const CN=(r,h,s=8)=>new T.ConeGeometry(r,h,s);
const SP=(r,a=8,b=6)=>new T.SphereGeometry(r,a,b);
const QD=(w,d)=>{const g=new T.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);return g};
function strut(mg,a,b,t,col){const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2],l=Math.sqrt(dx*dx+dy*dy+dz*dz);put(mg,BX(t,t,l),(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,col,Math.atan2(dx,dz),null,-Math.atan2(dy,hyp(dx,dz)))}
const mgW=MG(),mgF=MG();
const solids=[];
function solid(x,z,w,d){solids.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2})}
/* ===== layout ===== */
const XS=[-280,-210,-140,140,210,280],ZS=[-280,-210,-140,-70,0,70,140,210,280],RW=14,SHORE=110,LIM=326;
const BCX=[-245,-175,175,245],BCZ=[-245,-175,-105,-35,35,105,175,245];
function zoneName(x,z){if(Math.abs(x)<SHORE)return 'BOĞAZ KÖPRÜSÜ';if(x<0)return z<-70?'SULTANAHMET':z>70?'BEYOĞLU':'TAKSİM';return z<-70?'ÜSKÜDAR':z>70?'ATAŞEHİR':'KADIKÖY'}
function onRoad(x,z){for(const xr of XS)if(Math.abs(x-xr)<RW/2)return true;for(const zr of ZS)if(Math.abs(z-zr)<RW/2&&(Math.abs(x)>=SHORE||zr===0))return true;return false}
/* ===== roads, water, ground ===== */
(function(){
 const wm=new T.Mesh(new T.PlaneGeometry(4000,4000).rotateX(-Math.PI/2),new T.MeshBasicMaterial({map:waterTex,color:0xe6f0ff}));wm.position.y=-1.2;world.add(wm);world.userData.water=wm;
 const landM=new T.MeshBasicMaterial({color:0xa49c92});
 for(const s of[-1,1]){const l=new T.Mesh(BX(220,3,660),landM);l.position.set(s*220,-1.5,0);world.add(l)}
 const rmat=t=>new T.MeshBasicMaterial({map:t,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
 function road(x,z,len,horiz){const t=roadTex.clone();t.needsUpdate=true;t.repeat.set(1,len/20);const m=new T.Mesh(new T.PlaneGeometry(RW,len).rotateX(-Math.PI/2),rmat(t));m.position.set(x,0.04,z);if(horiz)m.rotation.y=Math.PI/2;world.add(m)}
 for(const xr of XS)road(xr,0,660,false);
 for(const zr of ZS){if(zr===0)road(0,0,660,true);else{road(220,zr,220,true);road(-220,zr,220,true)}}
 /* bridge deck & intersections & zebra */
 put(mgF,BX(220,1.4,15),0,-0.75,0,0x6b6d78);
 for(const xr of XS)for(const zr of ZS){
  put(mgF,QD(RW,RW),xr,0.07,zr,0x3d3d47);
  for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){
   if(dx&&Math.abs(xr+dx*20)<SHORE&&zr!==0)continue;
   for(let k=-2;k<=2;k++){const a=dx?[3,1.2]:[1.2,3],ox=dx?dx*9:k*2.5,oz=dz?dz*9:k*2.5;put(mgF,QD(a[0],a[1]),xr+ox,0.08,zr+oz,0xe8e8e8)}}}
 /* seawall & bridge rails */
 for(const s of[-1,1]){put(mgF,BX(4,2.4,660),s*(LIM+2),1.2,0,0x8d867c);put(mgF,BX(660,2.4,4),0,1.2,s*(LIM+2),0x8d867c);
  put(mgF,BX(220,0.9,0.3),0,0.45,s*7.2,0xd9d6d0)}
})();
/* ===== trees, lamps ===== */
function palm(x,z){const h=rr(6,8.5);put(mgF,CY(0.22,0.34,h,5),x,h/2,z,0x8a6a45);for(let i=0;i<7;i++){const g=BX(0.7,0.08,4.2);g.translate(0,0,2.1);put(mgF,g,x,h,z,i%2?0x2f9e5a:0x3fb36a,i*Math.PI*2/7,null,0.55)}}

function lamp(x,z){put(mgF,CY(0.1,0.14,6,5),x,3,z,0x2d2d36);put(mgF,BX(0.9,0.25,0.5),x,6.1,z,0xffe9a8)}
/* ===== buildings ===== */

  if(c.leave>14||hyp(c.x-player.x,c.z-player.z)>150&&c.leave>6){removeCar(c);ambs.splice(ambs.indexOf(c),1);return}}
 if(c.mode!=='stop')resolve(c,c.r);}
function updateBodies(dt){for(const b of bodies){if(b.state==='dead')b.deadT+=dt}
 if(!player.inside){for(const b of bodies){if(!b.claimed&&b.state==='dead'&&b.deadT>2.8&&ambs.length<3){spawnAmbulance(b);break}}}}
/* ===== cars master update ===== */
function updateCars(dt){
 const pc=player.car;
 let nTraf=0;for(const c of cars)if(c.ai)nTraf++;
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(c===pc){continue}
  if(c.type==='police'){policeAI(c,dt)}
  else if(c.type==='ambulance'){ambAI(c,dt)}
  else if(c.ai&&!c.free){trafficAI(c,dt);const d=hyp(c.x-player.x,c.z-player.z);if(d>190&&!player.inside){if(!placeTraffic(c,70,170)){}}}
  else{if(!c.owned&&hyp(c.x-player.x,c.z-player.z)>230){removeCar(c);continue}c.x+=c.vx*dt;c.z+=c.vz*dt;const f=Math.max(0,1-dt*2.4);c.vx*=f;c.vz*=f;if(c.vx||c.vz)resolve(c,c.r);if(c.hp<=0&&!c.burnt){c.burnt=true;explosion(c.x,c.z);c.mesh.material.color.set(0x222222)}
   if(c.owned&&!pc&&hyp(c.x-player.x,c.z-player.z)>260){removeCar(c);continue}
   if(c.owned&&c.v){c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),8*dt);c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt;resolve(c,c.r)}}
  if(c.burnt&&R()<dt*10)spawnPart('smoke',c.x,1.4,c.z,0,2.5,0,1.2,0.9);
  syncCar(c);c.mesh.visible=player.inside?false:hyp(c.x-player.x,c.z-player.z)<260}
 if(pc){pc.mesh.visible=!player.inside}
 if(!player.inside){while(nTraf<24&&cars.length<48){spawnTraffic();nTraf++}
  policeT-=dt;if(policeT<=0){policeT=1.8;let np=0;for(const c of cars)if(c.type==='police'&&c.mode!=='leave')np++;if(np<policeWant())spawnPolice()}}}
/* ===== HUD & radar ===== */
let lastZone='',zoneT=0;const radar=$('radar'),rx=radar.getContext('2d');
function hud(dt){
 $('money').textContent='$'+Math.floor(player.money);$('hpbar').style.width=clamp(player.hp,0,100)+'%';
 const st=$('stars').children;for(let i=0;i<5;i++)st[i].classList.toggle('on',i<player.wanted);$('stars').classList.toggle('flash',player.wanted>0&&seenT<4);
 clockMin+=dt/3;const hh=Math.floor(clockMin/60)%24,mm=Math.floor(clockMin%60);$('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
 const zn=player.inside?player.inside.type==='bar'?'BAR':player.inside.type==='kebab'?'KEBAPÇI':'KAHVEHANE':zoneName(player.x,player.z);
 if(zn!==lastZone){lastZone=zn;const z=$('zone');z.textContent=zn;z.style.opacity=1;clearTimeout(zoneT);zoneT=setTimeout(()=>z.style.opacity=0,2600)}
 /* radar */
 const S=1.25,cx=104,cy=104,y=camYaw,cs=Math.cos(y),sn=Math.sin(y);
 const rp=(x,z)=>{const dx=x-player.x,dz=z-player.z;return[cx+(dx*-cs+dz*sn)*S,cy-(dx*sn+dz*cs)*S]};
 rx.fillStyle='#1c6f86';rx.fillRect(0,0,208,208);
 if(player.inside){rx.fillStyle='#2a1a3a';rx.fillRect(0,0,208,208);const p=[[-13,IZ-11],[13,IZ-11],[13,IZ+11],[-13,IZ+11]].map(a=>rp(a[0],a[1]));rx.fillStyle='#5a3a6a';rx.beginPath();p.forEach((q,i)=>i?rx.lineTo(q[0],q[1]):rx.moveTo(q[0],q[1]));rx.fill()}
 else{
  for(const s of[-1,1]){const p=[[s*SHORE,-LIM],[s*LIM,-LIM],[s*LIM,LIM],[s*SHORE,LIM]].map(a=>rp(a[0],a[1]));rx.fillStyle='#4a5a4c';rx.beginPath();p.forEach((q,i)=>i?rx.lineTo(q[0],q[1]):rx.moveTo(q[0],q[1]));rx.fill()}
  rx.strokeStyle='#8a8a96';rx.lineWidth=RW*S*0.55;rx.lineCap='butt';
  for(const xr of XS){const a=rp(xr,-LIM),b=rp(xr,LIM);rx.beginPath();rx.moveTo(a[0],a[1]);rx.lineTo(b[0],b[1]);rx.stroke()}
  for(const zr of ZS){if(zr===0){const a=rp(-LIM,0),b=rp(LIM,0);rx.beginPath();rx.moveTo(a[0],a[1]);rx.lineTo(b[0],b[1]);rx.stroke()}else for(const s of[-1,1]){const a=rp(s*SHORE,zr),b=rp(s*LIM,zr);rx.beginPath();rx.moveTo(a[0],a[1]);rx.lineTo(b[0],b[1]);rx.stroke()}}
  for(const v of venues){const q=rp(v.door.x,v.door.z);rx.fillStyle='#ff4fa3';rx.fillRect(q[0]-4,q[1]-4,8,8)}
  const bl=Math.floor(gameT*5)%2;
  for(const c of cars){if(c.type!=='police'&&c.type!=='ambulance')continue;const q=rp(c.x,c.z);rx.fillStyle=c.type==='ambulance'?'#fff':bl?'#ff3b4e':'#3d7bff';rx.beginPath();rx.arc(q[0],q[1],4,0,7);rx.fill()}
  for(const p of peds)if(p.kind==='cop'&&p.state!=='dead'){const q=rp(p.x,p.z);rx.fillStyle=bl?'#ff3b4e':'#3d7bff';rx.fillRect(q[0]-2,q[1]-2,4,4)}
  if(heli){const q=rp(heli.x,heli.z);rx.fillStyle='#ffd23f';rx.beginPath();rx.arc(q[0],q[1],4,0,7);rx.fill()}}
 rx.save();rx.translate(cx,cy);rx.rotate(player.h-y);rx.fillStyle='#fff';rx.strokeStyle='#000';rx.lineWidth=2;rx.beginPath();rx.moveTo(0,-8);rx.lineTo(6,7);rx.lineTo(0,3);rx.lineTo(-6,7);rx.closePath();rx.stroke();rx.fill();rx.restore()}
/* ===== audio ===== */
let AC=null,master,nbuf,sirenO,sirenG,heliG,engO,engG,musG,musicOn=true,nextNote=0,step=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 sirenO=AC.createOscillator();sirenO.type='sawtooth';sirenG=AC.createGain();sirenG.gain.value=0;sirenO.connect(sirenG);sirenG.connect(master);sirenO.start();
 const ho=AC.createOscillator();ho.type='sawtooth';ho.frequency.value=22;heliG=AC.createGain();heliG.gain.value=0;ho.connect(heliG);heliG.connect(master);ho.start();
 engO=AC.createOscillator();engO.type='sawtooth';engG=AC.createGain();engG.gain.value=0;const lp=AC.createBiquadFilter();lp.frequency.value=380;engO.connect(lp);lp.connect(engG);engG.connect(master);engO.start();
 musG=AC.createGain();musG.gain.value=0;musG.connect(master);nextNote=AC.currentTime+0.1;setInterval(sched,90)}
function noise(dur,freq,vol,type){const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+dur)}
function tone(f,dur,vol,type,t0,dest,f2){const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+0.02)}
function beep(k){if(!AC)return;const t=AC.currentTime;
 if(k==='shot'){noise(0.16,2200,0.9);tone(160,0.12,0.6,'sine',t,master,50)}else if(k==='shot2'){noise(0.12,1500,0.35)}
 else if(k==='bump'){noise(0.2,500,0.5)}else if(k==='boom'){noise(0.8,400,1);tone(90,0.7,0.8,'sine',t,master,30)}
 else if(k==='cash'){tone(880,0.1,0.25,'square',t);tone(1320,0.18,0.25,'square',t+0.08)}}
const CH=[45,41,48,43],ARP=[0,7,12,7,0,7,12,15],mf=n=>440*Math.pow(2,(n-69)/12);
function sched(){if(!AC||!musicOn)return;const sd=0.139;while(nextNote<AC.currentTime+0.3){const t=nextNote,ch=CH[(step>>4)%4],s=step%16;
  if(s%4===0){tone(120,0.18,0.5,'sine',t,musG,40)}if(s%2===1)tone(6000,0.04,0.05,'square',t,musG);
  if(s%4===0||s%4===3)tone(mf(ch),0.2,0.22,'sawtooth',t,musG);
  tone(mf(ch+24+ARP[s%8]),0.13,0.12,'square',t,musG);
  step++;nextNote+=sd}}
function audioUpdate(dt){if(!AC)return;const t=AC.currentTime;
 let sd=1e9;for(const c of cars)if((c.type==='police'&&c.mode!=='leave'||c.type==='ambulance')&&c.mesh.visible){sd=Math.min(sd,hyp(c.x-player.x,c.z-player.z))}
 sirenO.frequency.setTargetAtTime(750+280*Math.sin(gameT*6),t,0.03);sirenG.gain.setTargetAtTime(player.inside?0:clamp(1-sd/130,0,1)*0.05,t,0.1);
 const hd=heli&&!player.inside?hyp(heli.x-player.x,heli.z-player.z):1e9;heliG.gain.setTargetAtTime(clamp(1-hd/200,0,1)*(0.5+0.5*Math.sin(gameT*26))*0.09,t,0.02);
 engO.frequency.setTargetAtTime(48+Math.abs(player.car?player.car.v:0)*4.5,t,0.1);engG.gain.setTargetAtTime(player.car?0.05:0,t,0.1);
 musG.gain.setTargetAtTime(!musicOn?0:player.car?0.5:player.inside?0.35:0.0,t,0.3)}
/* ===== death ===== */
function die(){if(player.dead)return;player.dead=true;player.deadT=0;$('wasted').style.opacity=1;player.mesh.rotation.x=-Math.PI/2;player.mesh.position.y=0.22;beep('boom');
 if(player.car){const c=player.car;player.car=null;c.v=0;player.mesh.visible=true}}
function respawn(){$('wasted').style.opacity=0;player.dead=false;player.hp=100;player.money=Math.max(0,player.money-200);setWanted(0);
 if(player.inside){world.visible=true;skyG.visible=true;player.inside.g.visible=false;world.add(player.mesh);player.inside=null;scene.fog.near=70;scene.fog.far=340;scene.fog.color.set(0xf0a58c);renderer.setClearColor(0x000000)}
 player.x=-128;player.z=12;player.h=Math.PI/2;player.mesh.rotation.x=0;player.mesh.position.y=0;player.mesh.visible=true;camYaw=Math.PI/2;say('Hastaneden çıktın. -$200',2600)}
/* ===== camera ===== */
function updateCamera(dt){
 const car=player.car,tx=player.x,tz=player.z,ty=car?1.7:1.9;
 camDragT-=dt;
 if(car&&camDragT<=0){camYaw+=angDiff(camYaw,car.h)*Math.min(1,dt*(Math.abs(car.v)>2?2.4:0.5))}
 const dist=car?(car.type==='bus'?15:11):(player.inside?7:8.5),pitch=player.inside?0.4:camPitch,cy=Math.cos(pitch);let d=dist;
 if(!player.inside){for(let s=1.5;s<=dist;s+=1.5){if(inSolid(tx-Math.sin(camYaw)*cy*s,tz-Math.cos(camYaw)*cy*s)){d=Math.max(2.5,s-1.5);break}}}
 let px=tx-Math.sin(camYaw)*cy*d,pz=tz-Math.cos(camYaw)*cy*d,py=ty+Math.sin(pitch)*d;
 if(player.inside){px=clamp(px,-12.4,12.4);pz=clamp(pz,IZ-10.4,IZ+10.4);py=Math.min(py,5.6)}
 camera.position.set(px,Math.max(0.8,py),pz);camera.lookAt(tx,ty,tz);
 if(player.drunk>0)camera.rotateZ(Math.sin(gameT*1.5)*0.09*Math.min(1,player.drunk/5));
 skyG.position.copy(camera.position)}
/* ===== input ===== */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
let stickId=null,stickX=0,stickY=0,lookId=null,lastLX=0,lastLY=0,kbOn=false;
const stickEl=$('stick'),knob=$('knob');
function isUI(t){return t.closest&&(t.closest('.btn')||t.closest('#bMus')||t.closest('#title'))}
addEventListener('pointerdown',e=>{if(!started||isUI(e.target))return;
 if(e.clientX<innerWidth*0.45&&stickId===null){stickId=e.pointerId;stickX=e.clientX;stickY=e.clientY;stickEl.style.left=(e.clientX-64)+'px';stickEl.style.top=(e.clientY-64)+'px';stickEl.style.bottom='auto'}
 else if(lookId===null){lookId=e.pointerId;lastLX=e.clientX;lastLY=e.clientY}});
addEventListener('pointermove',e=>{
 if(e.pointerId===stickId){const dx=e.clientX-stickX,dy=e.clientY-stickY,l=Math.min(1,hyp(dx,dy)/56),a=Math.atan2(dy,dx);input.mx=Math.cos(a)*l;input.my=-Math.sin(a)*l;knob.style.transform='translate('+Math.cos(a)*l*50+'px,'+Math.sin(a)*l*50+'px)'}
 else if(e.pointerId===lookId){camYaw-=(e.clientX-lastLX)*0.0065;camPitch=clamp(camPitch+(e.clientY-lastLY)*0.004,0.08,0.9);lastLX=e.clientX;lastLY=e.clientY;camDragT=2.5}});
function endPtr(e){if(e.pointerId===stickId){stickId=null;input.mx=input.my=0;knob.style.transform='';stickEl.style.left='';stickEl.style.top='';stickEl.style.bottom=''}if(e.pointerId===lookId)lookId=null}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
function bindBtn(id,key){const b=$(id);const on=e=>{e.preventDefault();input[key]=true;b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(_){}},off=e=>{input[key]=false;b.classList.remove('down')};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
bindBtn('bFire','fire');bindBtn('bAct','act');bindBtn('bRun','run');
$('bMus').addEventListener('pointerdown',e=>{e.preventDefault();musicOn=!musicOn;$('bMus').style.opacity=musicOn?1:0.45;say(musicOn?'Radyo açık':'Radyo kapalı',900)});
function readKeys(){
 const k=keys;let mx=0,my=0;if(k.KeyW||k.ArrowUp)my+=1;if(k.KeyS||k.ArrowDown)my-=1;if(k.KeyA||k.ArrowLeft)mx-=1;if(k.KeyD||k.ArrowRight)mx+=1;
 const any=mx||my||k.Space||k.KeyE||k.ShiftLeft||k.ShiftRight||k.KeyF;
 if(any||kbOn){kbOn=!!any;if(stickId===null){input.mx=mx;input.my=my}if(k.Space||k.KeyF)input.fire=true;else if(!$('bFire').classList.contains('down'))input.fire=false;
  if(k.KeyE)input.act=true;else if(!$('bAct').classList.contains('down'))input.act=false;
  if(k.ShiftLeft||k.ShiftRight)input.run=true;else if(!$('bRun').classList.contains('down'))input.run=false}
 if(k.KeyZ){camYaw+=0.04;camDragT=2}if(k.KeyC){camYaw-=0.04;camDragT=2}}
/* ===== game start ===== */
function initWorld(){
 const car=makeCar('sedan',-136,10,0);car.owned=true;car.mode='parked';car.maxV=23;car.v=0;car.free=true;car.mesh.material.color.set(0xe8872c);
 for(let i=0;i<46;i++){const s=pedSpot(8,130);if(s)addPed('civ',s[0],s[1])}
 for(let i=0;i<22;i++)spawnTraffic();
 player.mesh.position.set(player.x,0,player.z);camYaw=0.2}
function wanderTick(dt){/* wanted decay */
 if(player.wanted<1)return;let nd=1e9;
 for(const c of cars)if(c.type==='police'&&c.mode!=='leave')nd=Math.min(nd,hyp(c.x-player.x,c.z-player.z));
 for(const p of peds)if(p.kind==='cop'&&p.state!=='dead')nd=Math.min(nd,hyp(p.x-player.x,p.z-player.z));
 if(heli)nd=Math.min(nd,hyp(heli.x-player.x,heli.z-player.z)*0.8);
 if(nd<65&&!player.inside)seenT=0;else seenT+=dt;
 if(seenT>20){seenT=0;setWanted(player.wanted-1);say(player.wanted?'Polis seni kaybetti. Biraz daha dikkat!':'Aranma kalktı',2000)}}
let last=performance.now(),pedTick=0,fps=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(!started){camera.position.set(-120+Math.sin(now/6000)*30,18,-30);camera.lookAt(0,10,0);skyG.position.copy(camera.position);renderer.render(scene,camera);return}
 gameT+=dt;readKeys();
 if(player.dead){player.deadT+=dt;if(player.deadT>3.6)respawn()}
 updatePlayer(dt);updatePeds(dt);updateCars(dt);updateHeli(dt);updateBodies(dt);updateParts(dt);wanderTick(dt);
 player.hurtT-=dt;
 for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.t-=dt;if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();tracers.splice(i,1)}}
 for(const k of cashes){k.m.rotation.y+=dt*2.5;k.m.position.y=0.5+Math.sin(gameT*3)*0.12}
 for(const f of ferries){const u=f.userData,north=u.z0>0;f.position.z+=u.s*4*dt;if(north){if(f.position.z>310)u.s=-1;if(f.position.z<28)u.s=1}else{if(f.position.z<-310)u.s=1;if(f.position.z>-28)u.s=-1}f.rotation.y=u.s>0?0:Math.PI}
 world.userData.water.material.map.offset.x+=dt*0.0015;
 const pul=1+Math.sin(gameT*4)*0.12;for(const m of markers){m.scale.set(pul,1,pul)}
 for(const t in interiors){const it=interiors[t];if(it.g.visible&&it.lights.length)it.lights.forEach((l,i)=>{l.position.x=Math.sin(gameT*0.7+i*1.7)*8;l.position.z=IZ+Math.cos(gameT*0.9+i*2.1)*7})}
 pedTick-=dt;if(pedTick<=0){pedTick=1.2;maintainPeds()}
 hud(dt);audioUpdate(dt);updateCamera(dt);
 renderer.render(scene,camera)}
function startGame(){
 if(started)return;started=true;initAudio();if(AC&&AC.state==='suspended')AC.resume();
 $('title').style.display='none';$('hud').hidden=false;$('ctl').hidden=false;
 try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}
 initWorld();say('İstanbul seni bekliyor',2500)}
$('play').addEventListener('click',startGame);
if(window.claude&&window.claude.hot){}
requestAnimationFrame(frame);
})();
